<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | Booking Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global-styles.css}">
</head>
<body>
<div class="login-split">
    <div class="login-banner">
        <img src="https://cdn-icons-png.flaticon.com/512/2665/2665126.png" width="80" alt="Logo">
        <h2 class="mt-4">Smart Service Booking Management System</h2>
        <p class="text-secondary">Streamline your bookings efficiently and effectively.</p>
    </div>
    <div class="login-form-area">
        <div style="width: 350px;">
            <h3 class="fw-bold">Welcome Back! 👋</h3>
            <p class="text-muted mb-4">Please login to your account</p>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                <p class="text-center mt-3">Don't have an account? <a th:href="@{/register}">Register here</a></p>
            </form>
        </div>
    </div>
</div>
</body>
</html>
