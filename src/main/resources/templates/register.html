<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Smart Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global-styles.css}">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm p-4 border-0" style="border-radius: 15px;">
                <h3 class="text-center mb-4">Create Account</h3>

                <!-- Updated: Added th:object to bind the form to the User object -->
                <form th:action="@{/register}" th:object="${user}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <!-- Updated: Added th:field for automatic data binding -->
                        <input type="text" th:field="*{username}" class="form-control"
                               placeholder="Choose a unique username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <!-- Updated: Added th:field for automatic data binding -->
                        <input type="password" th:field="*{password}" class="form-control"
                               placeholder="Create a strong password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Sign Up</button>
                    <hr>
                    <p class="text-center">Already have an account? <a th:href="@{/login}" class="text-decoration-none">Login</a></p>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
