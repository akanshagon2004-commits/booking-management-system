<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 p-4">
                <h4 class="mb-4 text-center fw-bold" th:text="${userRole == 'ROLE_CUSTOMER' ? 'Request New Service' : 'Add New Booking'}">Add New Booking</h4>

                <form th:action="@{/bookings/save}" th:object="${booking}" method="post">

                    <div class="mb-3" th:if="${userRole != 'ROLE_CUSTOMER'}">
                        <label class="form-label">Customer Name</label>
                        <input type="text" th:field="*{customerName}" class="form-control" placeholder="Enter name">
                    </div>

                    <div class="mb-3" th:if="${userRole != 'ROLE_CUSTOMER'}">
                        <label class="form-label">Booking Amount (₹)</label>
                        <div class="input-group">
                            <span class="input-group-text">₹</span>
                            <input type="number" th:field="*{amount}" class="form-control">
                        </div>
                    </div>

                    <div th:if="${userRole == 'ROLE_CUSTOMER'}" class="alert alert-info mb-4 shadow-sm">
                        <i class="fas fa-info-circle me-2"></i>
                        <strong>Standard Service:</strong> Your booking will be requested under your profile. A standard fee of ₹1500.00 will be applied upon approval.
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Save Booking</button>

                        <a th:href="${userRole == 'ROLE_CUSTOMER' ? '/dashboard' : '/bookings/list'}"
                           class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
