<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 p-4">
                <h4 class="mb-4 text-center fw-bold">Edit Booking</h4>
                <form th:action="@{/bookings/update}" th:object="${booking}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label text-muted">Booking ID (Read-only)</label>
                        <input type="text" th:field="*{bookingId}" class="form-control bg-light" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Customer Name</label>
                        <input type="text" th:field="*{customerName}" class="form-control">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Status</label>
                        <select th:field="*{status}" class="form-select">
                            <option th:each="s : ${T(com.example.BookingManagement.model.BookingStatus).values()}"
                                    th:value="${s}" th:text="${s}"></option>
                        </select>
                    </div>


                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Update Booking</button>
                        <a th:href="${userRole == 'ROLE_CUSTOMER' ? '/dashboard' : '/bookings/list'}"
                           class="btn btn-outline-secondary">Back to List</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
